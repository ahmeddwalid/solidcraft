<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="800" viewBox="0 0 1280 800"><title>Nodal quartic — cancellation and Bernstein construction</title><g id="Layer_1" data-name="Layer 1"><rect width="1280" height="800" x="0" y="0" fill="#fff"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 35 45)" xml:space="preserve"><tspan x="0" y="0">Why the nodal-quartic spine lost precision</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 35 78)" xml:space="preserve"><tspan x="0" y="0">Same rational construction; different arithmetic for its homogeneous weight.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 35 126)" xml:space="preserve"><tspan x="0" y="0">Global power coefficients</tspan></text><rect width="340" height="90" x="35" y="150" fill="#f0f0f0" stroke="#999" stroke-miterlimit="10" stroke-width="1.5"/><rect width="340" height="90" x="460" y="150" fill="#f0f0f0" stroke="#999" stroke-miterlimit="10" stroke-width="1.5"/><rect width="340" height="90" x="885" y="150" fill="#f0f0f0" stroke="#999" stroke-miterlimit="10" stroke-width="1.5"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 50 180)" xml:space="preserve"><tspan x="0" y="0">Rounded global coefficients</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 50 210)" xml:space="preserve"><tspan x="0" y="0">c0, c1, c2, c3, c4</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 475 180)" xml:space="preserve"><tspan x="0" y="0">Signed terms nearly cancel</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 475 210)" xml:space="preserve"><tspan x="0" y="0">W(s) = sum of c_k s^k</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 900 180)" xml:space="preserve"><tspan x="0" y="0">Power-to-Bernstein conversion</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 900 210)" xml:space="preserve"><tspan x="0" y="0">Lost coefficient bits stay lost</tspan></text><g><g><path fill="#555" d="M385 194.25 L442 194.25 L442 195.75 L385 195.75 Z"/><path fill="#555" d="M445 195 L439 198 L439 192 Z"/></g></g><g><g><path fill="#555" d="M810 194.25 L867 194.25 L867 195.75 L810 195.75 Z"/><path fill="#555" d="M870 195 L864 198 L864 192 Z"/></g></g><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 460 270)" xml:space="preserve"><tspan x="0" y="0">Positive terms</tspan></text><rect width="270" height="12" x="460" y="283" fill="#1f6fb2"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 460 320)" xml:space="preserve"><tspan x="0" y="0">Magnitude of negative terms</tspan></text><rect width="268" height="12" x="460" y="333" fill="#555"/><polyline fill="none" stroke="#999" stroke-dasharray="5 4" stroke-miterlimit="10" stroke-width="1.5" points="730 288 785 288 785 340"/><line x1="728" x2="785" y1="339" y2="339" fill="none" stroke="#999" stroke-dasharray="5 4" stroke-miterlimit="10" stroke-width="1.5"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 810 305)" xml:space="preserve"><tspan x="0" y="0">Small residual W</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 810 330)" xml:space="preserve"><tspan x="0" y="0">Small coefficient errors become</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 810 348)" xml:space="preserve"><tspan x="0" y="0">large relative errors in W.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 35 385)" xml:space="preserve"><tspan x="0" y="0">Amplification: sum |c_k s^k| / |W(s)|</tspan></text><text x="0" y="0" fill="#1f6fb2" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 35 447)" xml:space="preserve"><tspan x="0" y="0">Direct Bernstein construction on each segment</tspan></text><rect width="340" height="100" x="35" y="475" fill="#dce9f5" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><rect width="340" height="100" x="460" y="475" fill="#dce9f5" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><rect width="340" height="100" x="885" y="475" fill="#dce9f5" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 50 505)" xml:space="preserve"><tspan x="0" y="0">Local endpoint directions</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 50 537)" xml:space="preserve"><tspan x="0" y="0">u = w(a), v = w(b)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 475 505)" xml:space="preserve"><tspan x="0" y="0">Quadratic Bernstein controls</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 475 537)" xml:space="preserve"><tspan x="0" y="0">P(u,u), P(u,v), P(v,v)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 900 500)" xml:space="preserve"><tspan x="0" y="0">Bernstein products</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 900 530)" xml:space="preserve"><tspan x="0" y="0">W = V^T A V</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 900 555)" xml:space="preserve"><tspan x="0" y="0">M = q W - 2 (g . V) V</tspan></text><g><g><path fill="#555" d="M385 524.25 L442 524.25 L442 525.75 L385 525.75 Z"/><path fill="#555" d="M445 525 L439 528 L439 522 Z"/></g></g><g><g><path fill="#555" d="M810 524.25 L867 524.25 L867 525.75 L810 525.75 Z"/><path fill="#555" d="M870 525 L864 528 L864 522 Z"/></g></g><rect width="1190" height="80" x="35" y="620" fill="#fff" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><text x="0" y="0" fill="#1f6fb2" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 50 648)" xml:space="preserve"><tspan x="0" y="0">Independent certificate</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 50 677)" xml:space="preserve"><tspan x="0" y="0">Both offset equations hold coefficient by coefficient; the canal identity certifies the round at bound 0.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 35 742)" xml:space="preserve"><tspan x="0" y="0">P(u,v) = (u^T C v) r - (r^T C u) v - (r^T C v) u</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 35 768)" xml:space="preserve"><tspan x="0" y="0">Local controls and Bernstein products avoid forming the cancelling global power coefficients.</tspan></text></g></svg>