<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900"><title>layers</title><rect width="1120" height="900" x="0" y="0" fill="#fff"/><text x="40" y="44" fill="#000" font-family="Helvetica" font-size="20" font-weight="bold">One click through the layers</text><rect width="580" height="56" x="120" y="80" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="104" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">Apps: solidcraft, solidcraft-cli</text><text x="132" y="124" fill="#000" font-family="Helvetica" font-size="12">Start the window or the headless CLI. Exempt from the layer rules.</text><rect width="580" height="72" x="120" y="164" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="188" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">L5 ui-egui, gpu, mcp</text><text x="132" y="208" fill="#000" font-family="Helvetica" font-size="12">The host. It hands each component plain data and runs what the component returns:</text><text x="132" y="225" fill="#000" font-family="Helvetica" font-size="12">the ribbon returns the Fillet button the user clicked.</text><path fill="none" stroke="#999" stroke-dasharray="2 4" stroke-width="1.5" d="M120 250 L700 250"/><text x="690" y="247" fill="#555" font-family="Helvetica" font-size="11" text-anchor="end">egui and wgpu stop here: nothing below reaches them, at any depth</text><rect width="580" height="56" x="120" y="264" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="288" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">L4 engine</text><text x="132" y="308" fill="#000" font-family="Helvetica" font-size="12">The session and the command registry: everything the user does is a command.</text><rect width="580" height="56" x="120" y="348" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="372" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">L3 io</text><text x="132" y="392" fill="#000" font-family="Helvetica" font-size="12">Design files, import and export.</text><rect width="580" height="56" x="120" y="432" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="456" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">L2 doc</text><text x="132" y="476" fill="#000" font-family="Helvetica" font-size="12">The feature timeline and its evaluation; it plans each body&apos;s display mesh.</text><rect width="580" height="56" x="120" y="516" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="540" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">L1 sketch, kernel, render, dynamics</text><text x="132" y="560" fill="#000" font-family="Helvetica" font-size="12">The constraint solver, the kernel boundary, view maths, dynamics.</text><rect width="580" height="56" x="120" y="600" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="132" y="624" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">L0 geom</text><text x="132" y="644" fill="#000" font-family="Helvetica" font-size="12">Vectors, planes, profiles, meshes and their measures.</text><rect width="316" height="492" x="764" y="164" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="776" y="188" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">Shared crates</text><text x="776" y="216" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">viewport-gpu</text><text x="776" y="230" fill="#333" font-family="Helvetica" font-size="11">the wgpu pipelines; evaluates display plans</text><text x="776" y="252" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">viewport-egui</text><text x="776" y="266" fill="#333" font-family="Helvetica" font-size="11">the viewport in an egui window</text><text x="776" y="288" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">viewport</text><text x="776" y="302" fill="#333" font-family="Helvetica" font-size="11">camera, pictures, CPU rasterizer</text><text x="776" y="324" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">theme</text><text x="776" y="338" fill="#333" font-family="Helvetica" font-size="11">the tokens every component draws with</text><text x="776" y="360" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">ui-text</text><text x="776" y="374" fill="#333" font-family="Helvetica" font-size="11">message catalogs and their lookup</text><text x="776" y="396" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">ui-registry</text><text x="776" y="410" fill="#333" font-family="Helvetica" font-size="11">where components publish their handles</text><text x="776" y="432" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">color</text><text x="776" y="446" fill="#333" font-family="Helvetica" font-size="11">the sRGB rule and analysis palette</text><text x="776" y="468" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">control, control-egui</text><text x="776" y="482" fill="#333" font-family="Helvetica" font-size="11">the control channel</text><text x="776" y="504" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold">mcp-server</text><text x="776" y="518" fill="#333" font-family="Helvetica" font-size="11">the MCP server machinery</text><text x="776" y="572" fill="#555" font-family="Helvetica" font-size="11">Any crate may use them. They use only each</text><text x="776" y="589" fill="#555" font-family="Helvetica" font-size="11">other, solidcore&apos;s public crates and external</text><text x="776" y="606" fill="#555" font-family="Helvetica" font-size="11">crates (UI toolkits included). Each builds and</text><text x="776" y="623" fill="#555" font-family="Helvetica" font-size="11">tests on its own: cargo xtask shared.</text><path fill="none" stroke="#999" stroke-dasharray="8 6" stroke-width="1.5" d="M30 690 L1090 690"/><text x="40" y="682" fill="#555" font-family="Helvetica" font-size="12" font-weight="bold">SolidCraft</text><text x="40" y="710" fill="#555" font-family="Helvetica" font-size="12" font-weight="bold">solidcore</text><text x="560" y="682" fill="#555" font-family="Helvetica" font-size="12" text-anchor="middle">crossed only through solidcore-ops, -tess and -record</text><rect width="240" height="64" x="100" y="726" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="112" y="750" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">solidcore-ops</text><text x="112" y="770" fill="#000" font-family="Helvetica" font-size="12">every modelling operation, as kernel calls</text><rect width="240" height="64" x="370" y="726" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="382" y="750" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">solidcore-record</text><text x="382" y="770" fill="#000" font-family="Helvetica" font-size="12">geometry as data</text><rect width="240" height="64" x="640" y="726" fill="#f0f0f0" stroke="#000" stroke-width="1.5" rx="8"/><text x="652" y="750" fill="#000" font-family="Helvetica" font-size="15" font-weight="bold">solidcore-tess</text><text x="652" y="770" fill="#000" font-family="Helvetica" font-size="12">the display mesher and its plans</text><rect width="780" height="48" x="100" y="812" fill="#fff" stroke="#999" stroke-dasharray="6 4" stroke-width="1.5" rx="8"/><text x="112" y="841" fill="#555" font-family="Helvetica" font-size="12">solidcore and solidcore-convert: the kernel and its conversions, private to solidcore. Never used here directly.</text><path fill="none" stroke="#000" stroke-width="1.5" d="M180 236 L180 264"/><path fill="#000" d="M180 264 L174 254 L186 254 Z"/><circle cx="205" cy="250" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="205" y="254" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">1</text><path fill="none" stroke="#000" stroke-width="1.5" d="M120 300 L96 300 L96 460 L120 460"/><path fill="#000" d="M120 460 L110 454 L110 466 Z"/><circle cx="96" cy="380" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="96" y="384" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">2</text><path fill="none" stroke="#000" stroke-width="1.5" d="M120 476 L70 476 L70 758 L100 758"/><path fill="#000" d="M100 758 L90 752 L90 764 Z"/><circle cx="70" cy="620" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="70" y="624" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">3</text><path fill="none" stroke="#000" stroke-width="1.5" d="M700 460 L732 460 L732 726"/><path fill="#000" d="M732 726 L726 716 L738 716 Z"/><circle cx="732" cy="600" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="732" y="604" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">4</text><path fill="none" stroke="#000" stroke-width="1.5" d="M700 192 L764 192"/><path fill="#000" d="M764 192 L754 186 L754 198 Z"/><circle cx="732" cy="192" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="732" y="196" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">5</text><path fill="none" stroke="#000" stroke-width="1.5" d="M764 226 L700 226"/><path fill="#000" d="M700 226 L710 220 L710 232 Z"/><circle cx="732" cy="226" r="11" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="732" y="230" fill="#000" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">6</text></svg>